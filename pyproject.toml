[project]
name = "hemepath-parsing"
version = "0.1.0"
description = "Parse bone marrow pathology report sections into structured data using Azure OpenAI structured outputs."
readme = "README.md"
requires-python = "==3.12.0"
dependencies = [
    "azure-identity>=1.25.3",
    "openai>=2.41.1",
    "pydantic>=2.13.4",
    "pyyaml>=6.0.3",
    "tqdm>=4.68.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.20",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
