[project]
name = "hemepath-parser"
version = "0.1.0"
description = "Parse bone marrow pathology report sections into structured data using Azure OpenAI structured outputs."
readme = "README.md"
license = "MIT"
authors = [{ name = "Luca Lanino", email = "lucalanino@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "azure-identity>=1.25.3",
    "openai>=2.41.1",
    "pydantic>=2.13.4",
    "pyyaml>=6.0.3",
    "tqdm>=4.68.2",
]

[project.urls]
Repository = "https://github.com/lucalanino/hemepath-parser"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.20",
]

[tool.uv]
default-groups = []

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
# Live tests are opt-in: `pytest` stays offline, free and green; `pytest -m live` runs them.
addopts = "-m 'not live'"
markers = ["live: hits the real Azure OpenAI deployment (costs money, needs az login)"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
