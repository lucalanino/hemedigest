# Bone marrow section parser config.
# Real secrets are NOT committed here -- put them in a gitignored overlay named
# config.local.yaml (next to this file), which is deep-merged on top at load.

azure_openai:
  endpoint: "<YOUR_AZURE_OPENAI_ENDPOINT>"
  deployment: "<YOUR_DEPLOYMENT>"
  # Pinned to the classic dated-api surface for prod stability; portable to the
  # v1 API where available. See README "API surface & version pinning".
  api_version: "2024-12-01-preview"
  tenant_id: "<YOUR_TENANT_ID>"
  scope: "https://cognitiveservices.azure.com/.default"
  # Auth strategy: "cli" uses your `az login` session (default; tenant_id then
  # optional). "browser" opens an interactive sign-in window and requires
  # tenant_id -- use it only where CLI auth is unavailable (e.g. the prod VM).
  auth: "cli"
  # gpt-5.x reasoning effort: none | low | medium | high | xhigh ('minimal' unsupported on 5.1+).
  reasoning_effort: "low"

files:
  input_jsonl: "data/sections.jsonl"
  output_dir: "data"
  output_prefix: "parsed"
  checkpoint: "data/.checkpoint.jsonl"

# Which sections to parse. The input file may contain all sections; only the
# ones listed here are parsed and emitted as columns. Comment out or remove a
# section to skip it. Valid: biopsy, aspirate, flow, cell_count, immunostains,
# specimen_header, final_dx. Omit this block entirely to parse all sections.
sections:
  - biopsy
  - aspirate
  - flow
  - cell_count
  - immunostains
  - specimen_header
  - final_dx

processing:
  max_concurrency: 20
  target_rpm: 2000
  target_tpm: 200000
  max_retries: 5
  retry_base_delay: 2.0
  # Global content dedup: parse byte-identical section text once and fan the result
  # out to every cell that shares it (boilerplate, "SEE ABOVE" stubs, a diagnosis
  # repeated across a report's instances). Lossless because the model only sees the
  # section prompt + text. Set false to parse every cell separately. Toggling this
  # changes checkpoint keys, so old checkpoint records are invalidated on change.
  dedup: true
