name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      # No Azure access here by design: the `live` marker is deselected via
      # addopts in pyproject.toml, so this is offline, free and deterministic.
      - name: Tests
        run: uv run pytest -q
